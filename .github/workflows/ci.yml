name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v3/sveltekit-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      compatibility-push: ${{ github.ref == 'refs/heads/v3/sveltekit-2' }}
